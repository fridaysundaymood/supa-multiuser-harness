name: Publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: supa-multiuser-harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: fridaysundaymood/android-kit
          path: android-kit
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --include-workspace-root --workspace=@budaknyenyel/kit-schema && npm run build --workspace=@budaknyenyel/kit-schema
        working-directory: android-kit
      - run: npm ci && npm run build
        working-directory: supa-multiuser-harness
      - run: node scripts/prepare-publish.mjs "$RUNNER_TEMP/package" "$GITHUB_REF_NAME"
        working-directory: supa-multiuser-harness
      - run: npm publish --ignore-scripts --provenance --access public
        working-directory: ${{ runner.temp }}/package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
