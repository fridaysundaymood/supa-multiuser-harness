name: CI
on: [push, pull_request]
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: supa-multiuser-harness
      - uses: actions/checkout@v4
        with:
          repository: fridaysundaymood/android-kit
          path: android-kit
      - uses: actions/checkout@v4
        with:
          repository: fridaysundaymood/kit-fixture-app
          path: kit-fixture-app
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install && npm run build
        working-directory: android-kit
      - run: npm ci
        working-directory: supa-multiuser-harness
      - run: npm run lint && npm run build && npm test
        working-directory: supa-multiuser-harness
      - name: Kotlin JVM tests
        shell: bash
        run: ../kit-fixture-app/gradlew --no-daemon -p harness-client test
        working-directory: supa-multiuser-harness
