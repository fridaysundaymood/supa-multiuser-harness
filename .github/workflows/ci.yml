name: CI
on: [push, pull_request]
jobs:
  fork-notice:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - run: echo "Sibling-dependent checks are skipped for fork pull requests because deploy keys are unavailable."
  checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: supa-multiuser-harness
      - uses: actions/checkout@v4
        with:
          repository: fridaysundaymood/android-kit
          path: android-kit
          ssh-key: ${{ secrets.DEPLOY_KEY_ANDROID_KIT }}
      - uses: actions/checkout@v4
        with:
          repository: fridaysundaymood/kit-fixture-app
          path: kit-fixture-app
          ssh-key: ${{ secrets.DEPLOY_KEY_KIT_FIXTURE_APP }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install && npm run build
        working-directory: android-kit
      - run: npm ci
        working-directory: supa-multiuser-harness
      - run: npm run lint && npm run build && npm test
        working-directory: supa-multiuser-harness
      - name: Kotlin JVM tests
        shell: bash
        run: ../kit-fixture-app/gradlew --no-daemon -p harness-client test
        working-directory: supa-multiuser-harness
