name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: supa-multiuser-harness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: fridaysundaymood/android-kit
          path: android-kit
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --include-workspace-root --workspace=@budaknyenyel/kit-schema && npm run build --workspace=@budaknyenyel/kit-schema
        working-directory: android-kit
      - run: npm ci
        working-directory: supa-multiuser-harness
      - run: npm run lint && npm run build && npm test
        working-directory: supa-multiuser-harness
      - name: Kotlin JVM tests
        shell: bash
        run: ./harness-client/gradlew --no-daemon -p harness-client test
        working-directory: supa-multiuser-harness
